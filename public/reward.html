<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — EduBoost</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b3d2e; color: #fff; min-height: 100vh; }
  .top-banner { background: #ffcc00; color: #000; text-align: center; padding: 12px; font-weight: bold; font-size: .95rem; border-bottom: 4px solid #000; overflow: hidden; }
  .top-banner span { display: inline-block; white-space: nowrap; animation: eb-banner 20s linear infinite; will-change: transform; }
  @keyframes eb-banner { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .top-banner span { animation: none; } }
  .container { max-width: 540px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; color: #222; border-radius: 14px; padding: 22px; margin-bottom: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  h1 { font-size: 1.25rem; color: #0b3d2e; margin-bottom: 6px; line-height: 1.35; }
  .exam { display: inline-block; background: #e8f5e9; color: #008751; font-size: .72rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; }
  .desc { font-size: .95rem; color: #333; white-space: pre-wrap; line-height: 1.55; margin-bottom: 14px; }
  .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .gallery a { line-height: 0; }
  .gallery img { width: 108px; height: 108px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e0e0; }
  .btn { display: inline-block; background: #008751; color: #fff; padding: 11px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: .9rem; margin: 0 8px 8px 0; }
  .btn-ghost { background: #0b3d2e; }
  .note { font-size: .85rem; color: #666; }
  .back { display: inline-block; margin-bottom: 14px; color: #ffd700; text-decoration: none; font-size: .9rem; font-weight: bold; }
  .footer { text-align: center; font-size: .78rem; color: #cfd8d3; margin: 8px 0 20px; }
  button.btn { border: 0; cursor: pointer; font-family: inherit; }
  button.btn:disabled { opacity: .6; cursor: progress; }
  .task { border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .task.done { border-color: #008751; background: #f3fbf6; }
  .task-text { flex: 1 1 60%; font-size: .92rem; color: #222; }
  .task b { color: #0b3d2e; }
  .bar-track { flex: 0 0 100%; height: 10px; background: #e7ebe9; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #008751, #39b54a); transition: width .3s; }
  .expired { background: #fff4e5; border: 1px solid #ffb74d; color: #8a4b00; font-size: .85rem; padding: 9px 11px; border-radius: 8px; margin-bottom: 12px; }
  .eb-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); background: #0b3d2e; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: .88rem; max-width: 92vw; box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999; }
  .eb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="top-banner"><span>🎓 FREE WAEC / NECO / JAMB QUESTIONS & PREP MATERIAL — 100% LEGITIMATE EDUCATIONAL SERVICE</span></div>

<div class="container">
  <a class="back" href="/">← Back to all content</a>
  <div class="card" id="content">
    <p class="note">Loading…</p>
  </div>
  <p class="footer">EduBoost — real educational service. No payment required.</p>
</div>

<script src="js/reward.js"></script>
</body>
</html>
